version: "3.9"

networks:
  app-network:
    driver: bridge

services:
  app:
    build: ./app
    env_file:
      - .env
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./static:/usr/share/nginx/html
    depends_on:
      - app
    networks:
      - app-network